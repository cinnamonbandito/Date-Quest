<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agata's Sidequests</title>
<style>
:root{
  --bg:#090a0f; --panel:#11131b; --panel2:#171a24; --text:#f2f3f7;
  --muted:#9499aa; --accent:#b8ff5a; --accent2:#7c5cff;
  --border:#292d3b;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(124,92,255,.18),transparent 28%),
    radial-gradient(circle at 90% 85%,rgba(184,255,90,.10),transparent 25%),
    var(--bg);
}
.app{max-width:1050px;margin:auto;padding:34px 20px 60px}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}
.kicker{color:var(--accent);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
h1{font-size:clamp(2.3rem,7vw,5rem);line-height:.95;margin:8px 0 12px;letter-spacing:-.055em}
.subtitle{color:var(--muted);max-width:620px;font-size:1rem}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 15px;min-width:100px}
.stat b{display:block;font-size:1.25rem}.stat span{color:var(--muted);font-size:.72rem}
.progress{height:8px;background:#20232e;border-radius:99px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}
h2{font-size:1.15rem;margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.quest{
  position:relative;text-align:left;color:var(--text);background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--border);border-radius:18px;padding:20px;min-height:170px;
  cursor:pointer;transition:.18s ease;overflow:hidden
}
.quest:hover{transform:translateY(-3px);border-color:#555c72}
.quest.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 15px 45px rgba(184,255,90,.08)}
.quest .icon{font-size:1.8rem}.tag{display:inline-block;margin-top:12px;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}
.quest h3{margin:7px 0 6px;font-size:1.05rem}.quest p{margin:0;color:var(--muted);font-size:.87rem;line-height:1.45}
.check{position:absolute;right:15px;top:15px;width:25px;height:25px;border:1px solid #444a5b;border-radius:50%;display:grid;place-items:center;color:transparent}
.selected .check{background:var(--accent);border-color:var(--accent);color:#090a0f;font-weight:900}
.actions{display:flex;gap:10px;margin-top:20px}
button.action{border:0;border-radius:12px;padding:13px 20px;font-weight:800;cursor:pointer}
.confirm{background:var(--accent);color:#090a0f}.cancel{background:#20232e;color:white}
#toast{
 position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;
 background:#f2f3f7;color:#090a0f;padding:15px 20px;border-radius:14px;font-weight:800;
 transition:.25s;pointer-events:none;box-shadow:0 15px 50px #000
}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{margin-top:35px;color:#626879;font-size:.75rem;text-align:center}
</style>
</head>
<body>
<div class="app">
<header>
<div>
<div class="kicker">Personal Quest Log · 2026</div>
<h1>Agata's<br>Sidequests</h1>
<div class="subtitle">Nicht jede Mission muss einen Zweck haben. Wähle eine Sidequest und mach heute etwas, das später eine gute Geschichte ergibt.</div>
</div>
<div class="stats">
<div class="stat"><b>22</b><span>LEVEL</span></div>
<div class="stat"><b>62%</b><span>XP</span><div class="progress"><i></i></div></div>
</div>
</header>

<h2>Wähle deine Sidequest</h2>
<div class="grid" id="quests"></div>

<div class="actions">
<button class="action confirm" onclick="confirmQuest()">✓ Quest annehmen</button>
<button class="action cancel" onclick="clearQuest()">× Zurücksetzen</button>
</div>

<footer>Class: Sporty Nerd · Tech Mage · Chaos Neutral</footer>
</div>
<div id="toast"></div>

<script>
const quests=[
  ["🦝","Raccoon Date","Chaos","Ihr habt 60 Minuten Zeit und müsst spontan das lustigste Date erfinden, das ihr für unter 15 € hinbekommt.","+200 XP"],
  ["🛒","€10 Challenge","Chaos","Jede Person bekommt 10 € und muss für die andere eine möglichst lustige Überraschung kaufen.","+150 XP"],
  ["🌅","Sunset Quest","Romantic","Einen schönen Aussichtspunkt suchen, Sonnenuntergang anschauen und einfach eine Weile zusammen sitzen.","+130 XP"],
  ["🏋️","Pump & Hust Hust","Fitness","Zusammen ins Gym gehen, gegenseitig pushen und danach so tun, als hätten wir gerade den Endgegner besiegt.","+140 XP"],
  ["🚗","Random Adventure","Adventure","Eine Münze werfen, irgendwohin fahren und den ersten interessanten Ort erkunden, den ihr findet.","+180 XP"]
  [""🥊💥,"Gymi und Tren ","Adventure","Eine Münze werfen, irgendwohin fahren und den ersten interessanten Ort erkunden, den ihr findet.","+180 XP"]
];
let selected=null;
const root=document.getElementById("quests");
quests.forEach((q,i)=>{
 const el=document.createElement("button"); el.className="quest"; el.type="button";
 el.innerHTML=`<div class="icon">${q[0]}</div><span class="tag">${q[2]} · ${q[4]}</span><h3>${q[1]}</h3><p>${q[3]}</p><div class="check">✓</div>`;
 el.onclick=()=>{document.querySelectorAll(".quest").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selected=i};
 root.appendChild(el);
});
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2600)}
function confirmQuest(){
 if(selected===null){toast("Wähle zuerst eine Sidequest.");return}
 const q=quests[selected]; toast(`QUEST ACCEPTED: ${q[1]} · ${q[4]}`);
}
function clearQuest(){selected=null;document.querySelectorAll(".quest").forEach(x=>x.classList.remove("selected"));toast("Quest-Auswahl zurückgesetzt.")}
</script>
</body>
</html>
